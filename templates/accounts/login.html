{% extends 'portal/base.html' %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-escudo">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5L12 1zm-1 14l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L17 9l-6 6z" />
          </svg>
        </div>
        <div class="auth-logo-nome">
          Portal Segurança Digital
          <span>Acesso restrito</span>
        </div>
      </div>

      <hr class="auth-divider">

      <h2 class="auth-titulo">Entrar</h2>
      <p class="auth-subtitulo">Acesse sua conta para continuar.</p>

      {% if error %}
        <div class="auth-erro">{{ error }}</div>
      {% endif %}

      <form method="post" class="auth-form">
        {% csrf_token %}
        {% if request.GET.next %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        <div class="form-row">
          <label for="id_username">Usuário</label>
          <input id="id_username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username">
        </div>
        <div class="form-row">
          <label for="id_password">Senha</label>
          <input id="id_password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password">
        </div>

        <div style="text-align: right; margin-top: -8px; margin-bottom: 16px;">
          <a href="{% url 'reset_password' %}" class="gov-link" style="font-size: 0.88rem; font-weight: 600;">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-form">Acessar Conta</button>
      </form>

      <p class="auth-link">
        Ainda não tem conta? <a href="{% url 'register' %}">Criar conta</a>
      </p>

    </div>
  </div>
{% endblock %}
