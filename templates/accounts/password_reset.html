{% extends 'portal/base.html' %}

{% block content %}
<section class="secao secao-alt" style="min-height: 70vh; display: flex; align-items: center;" aria-labelledby="titulo-recuperar">
  <div class="container" style="max-width: 480px; margin: 0 auto;">
    
    <div class="secao-header" style="text-align: center; margin-bottom: 24px;">
      <span class="golpe-tipo tipo-alto" aria-hidden="true">Segurança</span>
      <h1 id="titulo-recuperar" class="gov-title" style="font-size: 1.8rem; margin-bottom: 8px;">Recuperar Senha</h1>
      <p class="gov-text" style="font-size: 0.95rem;">Insira seu e-mail cadastrado para enviarmos as instruções de recuperação de acesso.</p>
    </div>

    <div class="form-card" style="background: #fff; border: 1px solid var(--cinza-linha); border-radius: 8px; padding: 32px;">
      <form method="post" novalidate>
        {% csrf_token %}
        
        <div class="form-row" style="margin-bottom: 20px;">
          {{ form.email.errors }}
          <label for="{{ form.email.id_for_label }}" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--cinza-escuro);">E-mail cadastrado:</label>
          <input type="email" name="email" id="{{ form.email.id_for_label }}" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid var(--cinza-linha); border-radius: 4px; box-sizing: border-box;" placeholder="exemplo@email.com">
        </div>

        <button type="submit" class="btn-form" style="width: 100%; padding: 12px; font-weight: 700;" aria-label="Enviar link de recuperação de senha">
          Enviar Instruções
        </button>
      </form>
    </div>
    
  </div>
</section>
{% endblock %}
