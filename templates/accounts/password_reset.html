{% extends 'portal/base.html' %}

{% block content %}
<section class="secao secao-alt" style="min-height: 70vh; display: flex; align-items: center;" aria-labelledby="titulo-recuperar">
  <div class="container" style="max-width: 480px; margin: 0 auto;">
    
    <div class="secao-header" style="text-align: center; margin-bottom: 24px;">
      <span class="golpe-tipo tipo-alto" aria-hidden="true">Segurança</span>
      <h1 id="titulo-recuperar" class="gov-title" style="font-size: 1.8rem; margin-bottom: 8px;">Recuperar Senha</h1>
      <p class="gov-text" style="font-size: 0.95rem;">Insira seu e-mail cadastrado para enviarmos as instruções de recuperação de acesso.</p>
    </div>

    <div class="form-card">
      <form method="post" novalidate>
        {% csrf_token %}
        
        <div class="form-row">
          {{ form.email.errors }}
          <label for="{{ form.email.id_for_label }}">E-mail cadastrado:</label>
          <input type="email" name="email" id="{{ form.email.id_for_label }}" required placeholder="exemplo@email.com">
        </div>

        <button type="submit" class="btn-form" aria-label="Enviar link de recuperação de senha">
          Enviar Instruções
        </button>
      </form>
    </div>
    
  </div>
</section>
{% endblock %}
