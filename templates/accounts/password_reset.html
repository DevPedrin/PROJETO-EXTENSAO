{% extends 'portal/base.html' %}

{% block content %}
<section class="secao" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 450px; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 class="section-title" style="font-size: 1.8rem; margin-bottom: 0.5rem;">Esqueceu a Senha?</h2>
      <p style="color: #666; font-size: 0.95rem;">Insira o seu e-mail cadastrado abaixo para receber as instruções de recuperação.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      
      <div style="margin-bottom: 1.5rem;">
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333;">E-mail do usuário:</label>
        <input type="email" name="email" id="{{ form.email.id_for_label }}" required class="form-control" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
      </div>

      <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; background: #0b2f59; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
        Enviar link de recuperação
      </button>
    </form>
    
  </div>
</section>
{% endblock %}
