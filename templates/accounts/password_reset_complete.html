{% extends 'portal/base.html' %}

{% block content %}
<section class="secao secao-alt" style="min-height: 70vh; display: flex; align-items: center;" aria-labelledby="titulo-concluido">
  <div class="container" style="max-width: 480px; margin: 0 auto; text-align: center;">
    
    <div class="form-card" style="background: #fff; border: 1px solid var(--cinza-linha); border-radius: 8px; padding: 40px;">
      <div style="font-size: 3.5rem; color: #15803d; margin-bottom: 16px;" aria-hidden="true">
        🎉
      </div>

      <h1 id="titulo-concluido" class="gov-title" style="font-size: 1.8rem; margin-bottom: 12px;">Senha Alterada</h1>
      
      <p class="gov-text" style="font-size: 0.95rem; margin-bottom: 24px;">
        Sua nova senha foi salva com sucesso. Você já pode utilizá-la para acessar sua conta no portal.
      </p>

      <a href="{% url 'login' %}" class="btn-form" style="display: inline-block; padding: 12px 32px; text-decoration: none; font-weight: 700;" aria-label="Ir para a página de login">
        Acessar Conta
      </a>
    </div>
    
  </div>
</section>
{% endblock %}
