{% extends 'portal/base.html' %}

{% block content %}
<section class="secao" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 450px; background: #fff; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; text-align: center;">
    
    <div style="font-size: 3.5rem; color: #28a745; margin-bottom: 1rem;">
      🎉
    </div>

    <h2 class="section-title" style="font-size: 1.8rem; margin-bottom: 1rem;">Senha Alterada!</h2>
    
    <p style="color: #555; line-height: 1.6; margin-bottom: 2rem;">
      Sua nova senha foi salva com sucesso. Você já pode utilizá-la para acessar sua conta no portal.
    </p>

    <a href="{% url 'login' %}" class="btn" style="display: inline-block; padding: 0.75rem 2rem; background: #0b2f59; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold;">
      Ir para o Login
    </a>
    
  </div>
</section>
{% endblock %}
