{% extends 'portal/base.html' %}

{% block content %}
<section class="secao secao-alt" aria-labelledby="titulo-editar-usuario">
  <div class="container" style="max-width: 650px; margin: 0 auto;">

    <div class="secao-header">
      <span class="golpe-tipo tipo-alto" aria-hidden="true">Administração</span>
      <h2 id="titulo-editar-usuario" class="gov-subtitle">Editar Usuário</h2>
      <p class="gov-text">Altere as informações cadastrais e o nível de acesso do usuário <strong>{{ usuario.username }}</strong>.</p>
    </div>

    <div class="form-card">
      <form method="post" autocomplete="off" novalidate>
        {% csrf_token %}

        <div class="form-grid-2" style="margin-bottom: 16px;">
          <div class="form-row" style="margin-bottom: 0;">
            <label for="username">Nome de Usuário *</label>
            <input type="text" id="username" name="username" value="{{ usuario.username }}" required>
          </div>
          <div class="form-row" style="margin-bottom: 0;">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
          </div>
        </div>

        <div class="form-row">
          <label for="nome_completo">Nome Completo</label>
          <input type="text" id="nome_completo" name="nome_completo" value="{{ usuario.nome_completo|default:'' }}">
        </div>

        <div class="form-grid-2" style="margin-bottom: 24px;">
          <div class="form-row" style="margin-bottom: 0;">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" value="{{ usuario.telefone }}" placeholder="(00) 00000-0000">
          </div>
          <div class="form-row" style="margin-bottom: 0;">
            <label for="tipo_usuario">Nível de Acesso *</label>
            <select id="tipo_usuario" name="tipo_usuario" required>
              <option value="usuario" {% if usuario.tipo_usuario == 'usuario' %}selected{% endif %}>Usuário Comum</option>
              <option value="moderador" {% if usuario.tipo_usuario == 'moderador' %}selected{% endif %}>Moderador</option>
              <option value="admin" {% if usuario.tipo_usuario == 'admin' %}selected{% endif %}>Administrador</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 16px; justify-content: flex-end; flex-wrap: wrap; margin-top: 24px;">
          <a href="{% url 'usuarios' %}" class="btn" style="background: transparent; border: 1px solid var(--gray-600); color: var(--gray-600);">
            Cancelar
          </a>
          <button type="submit" class="btn btn-primario">
            Salvar Alterações
          </button>
        </div>

      </form>
    </div>
  </div>
</section>
{% endblock %}
