{% extends 'portal/base.html' %}

{% block content %}
<section class="secao secao-alt">
  <div class="container" style="max-width:600px;">
    <div class="secao-header">
      <span class="golpe-tipo tipo-alto" aria-hidden="true">Moderação</span>
      <h2 class="gov-subtitle">Rejeitar Denúncia</h2>
      <p class="gov-text">Protocolo: <strong>{{ denuncia.protocolo }}</strong></p>
    </div>

    <div class="form-card" style="max-width: 600px; margin: 0 auto;">
      <form method="post">
        {% csrf_token %}
        <div class="form-row">
          <label for="motivo_moderacao">Motivo da rejeição</label>
          <textarea
            id="motivo_moderacao"
            name="motivo_moderacao"
            rows="5"
            required
            placeholder="Descreva o motivo da rejeição desta denúncia..."
          ></textarea>
        </div>
        <div style="display:flex; gap:12px; margin-top: 12px;">
          <button type="submit" class="btn" style="background: var(--vermelho-alerta); color: #fff;">
            Confirmar Rejeição
          </button>
          <a href="{% url 'portal:moderacao_denuncias' %}" class="btn" style="background: transparent; border: 1px solid var(--gray-600); color: var(--gray-600);">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
