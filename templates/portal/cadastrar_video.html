{% extends 'portal/base.html' %}
{% block content %}
<h2>Cadastrar Novo Vídeo Educativo</h2>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="titulo" placeholder="Título do Vídeo" required><br><br>
    <textarea name="descricao" placeholder="Descrição curta"></textarea><br><br>
    <input type="url" name="url_youtube" placeholder="URL do Vídeo (Youtube)" required><br><br>
    <button type="submit">Salvar Vídeo</button>
</form>
{% endblock %}
