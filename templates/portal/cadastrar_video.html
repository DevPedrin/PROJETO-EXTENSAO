{% extends 'portal/base.html' %}

{% block content %}
<section class="secao" aria-labelledby="titulo-cadastrar-video">
  <div class="container">

    <div class="secao-header">
      <span class="golpe-tipo tipo-dica" aria-hidden="true">Administração</span>
      <h2 id="titulo-cadastrar-video" class="gov-subtitle">Cadastrar Vídeo Educativo</h2>
      <p class="gov-text">Adicione conteúdos educativos sobre segurança digital ao portal.</p>
    </div>

    <div class="form-card" style="max-width: 560px;">
      <form method="POST" autocomplete="off" novalidate>
        {% csrf_token %}

        <div class="form-row">
          <label for="id-titulo-video">Título do vídeo <span class="obr" aria-hidden="true">*</span></label>
          <input type="text" id="id-titulo-video" name="titulo" placeholder="Ex.: Como identificar golpes pelo WhatsApp" required aria-required="true">
        </div>

        <div class="form-row">
          <label for="id-url-video">URL do YouTube <span class="obr" aria-hidden="true">*</span></label>
          <input type="url" id="id-url-video" name="url_youtube" placeholder="https://www.youtube.com/watch?v=..." required aria-required="true">
        </div>

        <div class="form-row">
          <label for="id-descricao-video">Descrição curta</label>
          <textarea id="id-descricao-video" name="descricao" placeholder="Resumo do conteúdo abordado no vídeo (até 3 linhas)"></textarea>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
          <button type="submit" class="btn btn-primario">Salvar</button>
          <a href="{% url 'portal:videos' %}" class="btn" style="background: transparent; border: 1px solid var(--gray-600); color: var(--gray-600);" aria-label="Cancelar e voltar para Vídeos">Cancelar</a>
        </div>

      </form>
    </div>

  </div>
</section>
{% endblock %}
